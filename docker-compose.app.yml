services:
  postgres:
    # TimescaleDB = PostgreSQL + 时序扩展（自动分块 hypertable / 连续聚合 / 压缩 / 保留策略）。
    # 镜像已预置 shared_preload_libraries=timescaledb，应用启动时 CREATE EXTENSION 即可。
    image: timescale/timescaledb:2.28.3-pg17
    container_name: ingot-postgres
    environment:
      POSTGRES_DB: ingot
      POSTGRES_USER: ingot
      POSTGRES_PASSWORD: ${INGOT_POSTGRES_PASSWORD:?INGOT_POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ingot-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingot -d ingot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  optimizer:
    build:
      context: .
      dockerfile: optimizer/Dockerfile
    container_name: ingot-optimizer
    ports:
      - "127.0.0.1:8100:8100"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/ready', timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  platform-api:
    build:
      context: .
      dockerfile: src/platform/Ingot.Platform.Api/Dockerfile
    container_name: ingot-platform-api
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./Data:/app/Data
      - ingot-inspection-attachments:/app/Data/inspection-attachments
      - ingot-inspection-archive:/app/Archive/inspection-attachments
      - ingot-process-knowledge:/app/Data/process-knowledge
      - ingot-process-knowledge-archive:/app/Archive/process-knowledge
    # 列表形式允许 Compose 在配置键中展开 EdgeId；映射形式只会展开值，
    # 会把令牌错误地固定到某个示例 Edge。
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Urls=http://+:8000
      - ConnectionStrings__Events=Host=postgres;Port=5432;Database=ingot;Username=ingot;Password=${INGOT_POSTGRES_PASSWORD:?INGOT_POSTGRES_PASSWORD is required}
      - EventIngest__RequireToken=true
      - EventIngest__KeyRetentionDays=${INGOT_EVENT_KEY_RETENTION_DAYS:-0}
      - Database__SchemaManagement=${INGOT_SCHEMA_MANAGEMENT:-Migrations}
      - EventIngest__EdgeTokens__${INGOT_EDGE_ID:?INGOT_EDGE_ID is required}=${INGOT_EDGE_TOKEN:?INGOT_EDGE_TOKEN is required}
      - Authentication__Mode=${INGOT_AUTH_MODE:-Local}
      - Authentication__Authority=${INGOT_AUTHORITY:-}
      - Authentication__Audience=${INGOT_AUDIENCE:-}
      - Authentication__RequireHttpsMetadata=${INGOT_AUTH_REQUIRE_HTTPS:-true}
      - Authentication__Local__SeedAdminUsername=${INGOT_ADMIN_USERNAME:-}
      - Authentication__Local__SeedAdminPassword=${INGOT_ADMIN_PASSWORD:-}
      - InspectionAttachments__RootPath=/app/Data/inspection-attachments
      - InspectionAttachments__ArchiveRootPath=/app/Archive/inspection-attachments
      - ProcessKnowledge__RootPath=/app/Data/process-knowledge
      - ProcessKnowledge__ArchiveRootPath=/app/Archive/process-knowledge
      - ProcessOptimizer__Enabled=${INGOT_OPTIMIZER_ENABLED:-true}
      - ProcessOptimizer__BaseUrl=http://optimizer:8100
      - ProcessOptimizer__RequestTimeoutSeconds=${INGOT_OPTIMIZER_TIMEOUT_SECONDS:-30}
      - Chat__Enabled=${INGOT_CHAT_ENABLED:-false}
      - Chat__Provider=${INGOT_CHAT_PROVIDER:-Deterministic}
      - Chat__FastModel=${INGOT_CHAT_FAST_MODEL:-deterministic-v1}
      - Chat__ReasoningModel=${INGOT_CHAT_REASONING_MODEL:-deterministic-v1}
      - Chat__EnableCombinedAnalysis=${INGOT_CHAT_ENABLE_COMBINED_ANALYSIS:-false}
      - Chat__MaxToolCalls=${INGOT_CHAT_MAX_TOOL_CALLS:-8}
      - Chat__MaxRunSeconds=${INGOT_CHAT_MAX_RUN_SECONDS:-60}
      - Chat__MaxDiscussionRounds=${INGOT_CHAT_MAX_DISCUSSION_ROUNDS:-3}
      - Chat__MaxDiscussionTurns=${INGOT_CHAT_MAX_DISCUSSION_TURNS:-9}
      - ChatDataAccess__Users__operator__AllowAll=${INGOT_CHAT_OPERATOR_ALLOW_ALL:-true}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - Cors__AllowedOrigins__0=http://localhost:3000
      - Webhook__Enabled=true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  platform-web:
    build:
      context: apps/platform
      dockerfile: Dockerfile
    container_name: ingot-platform-web
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  connector-host:
    profiles:
      - connector-host
    build:
      context: .
      dockerfile: src/edge/Ingot.Edge.ConnectorHost/Dockerfile
    container_name: ingot-connector-host
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      # 每个 Edge 实例必须使用独立持久目录；更换目录或丢失 outbox 时也必须更换 EdgeId，
      # 否则 Platform 会正确拒绝从 1 重新开始的 (EdgeId, Seq)。
      - ${INGOT_EDGE_DATA_PATH:-./Data/connector-host}:/app/Data
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Urls: http://+:8001
      ConnectorHost__IngestToken: ${INGOT_CONNECTOR_TOKEN:?INGOT_CONNECTOR_TOKEN is required}
      ConnectorHost__LocalApiToken: ${INGOT_CONNECTOR_LOCAL_TOKEN:-}
      Edge__EdgeId: ${INGOT_EDGE_ID:?INGOT_EDGE_ID is required}
      Edge__PlatformApiBaseUrl: http://platform-api:8000
      Edge__PublicBaseUrl: http://connector-host:8001
      Edge__EventIngestToken: ${INGOT_EDGE_TOKEN:?INGOT_EDGE_TOKEN is required}
      Acquisition__Enabled: "false"
      Acquisition__AllowLocalFallbackWhenPlatformAvailable: "false"
      Acquisition__DeploymentCachePath: /app/Data/acquisition-deployments.json
      Acquisition__StartupHealthTimeoutMs: "30000"
    depends_on:
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8001/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  ingot-postgres-data:
  ingot-inspection-attachments:
  ingot-inspection-archive:
  ingot-process-knowledge:
  ingot-process-knowledge-archive:
