[project]
name = "ingot-optimizer"
version = "0.4.0"
description = "Ingot 工艺研发数值服务：代理建模、约束判断与序贯实验建议"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "torch>=2.2",
    "gpytorch>=1.11",
    "botorch>=0.18.1,<0.19",
]

[project.optional-dependencies]
# uv sync --extra service   —— 起 HTTP 服务
service = ["fastapi>=0.110", "uvicorn>=0.29"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
required-version = "==0.12.5"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingot_optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
