[project]
name = "ingot-optimizer"
version = "0.4.0"
description = "Ingot 工艺研发优化大脑:序贯实验优化(高斯过程 + 贝叶斯优化 + 物理先验)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "torch>=2.2",
    "gpytorch>=1.11",
    "botorch>=0.18.1,<0.19",
    "ninja>=1.11,<2",
]

[project.optional-dependencies]
# uv sync --extra service   —— 起 HTTP 服务
service = ["fastapi>=0.110", "uvicorn>=0.29"]
# uv sync --extra viz       —— 画收敛图
viz = ["matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=8", "httpx2>=0.1"]

[tool.uv]
required-version = "==0.11.32"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingot_optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
