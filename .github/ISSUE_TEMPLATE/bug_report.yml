name: Bug report
description: Report reproducible behavior in Ingot
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include factory credentials, equipment addresses, or confidential process data.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include safe sample data, exact actions, and relevant logs.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision or version
      placeholder: commit SHA, branch, or release
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Edge / equipment acquisition
        - Platform API / data
        - Optimizer
        - Platform Web
        - Website / documentation
        - Deployment
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification already performed
      description: List tests, health checks, or replay steps already run.
