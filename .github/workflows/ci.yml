# 构建、测试、浏览器回归并验证可部署制品的主 CI 流水线。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: |
            apps/platform/package-lock.json
            apps/website/package-lock.json
            apps/docs-site/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: optimizer/uv.lock

      - name: Install browser regression runtime
        run: |
          npm --prefix apps/platform ci
          npm --prefix apps/platform exec -- playwright install --with-deps chromium

      - name: Verify repository
        env:
          INGOT_VERIFY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/verify.sh

      - name: Build application images
        env:
          INGOT_POSTGRES_PASSWORD: verification-postgres-password
          INGOT_SITE_ID: verification-site-0001
          INGOT_EDGE_ID: verification-edge-0001
          INGOT_EDGE_TOKEN: verification-edge-token-0001
          INGOT_OPERATOR_TOKEN: verification-operator-token-0001
          INGOT_CONNECTOR_TOKEN: verification-connector-token-0001
          INGOT_CONNECTOR_LOCAL_TOKEN: verification-connector-local-token-0001
        run: docker compose -f docker-compose.app.yml --profile connector-host build

      - name: Smoke application stack
        env:
          INGOT_POSTGRES_PASSWORD: verification-postgres-password
          INGOT_SITE_ID: verification-site-0001
          INGOT_EDGE_ID: verification-edge-0001
          INGOT_EDGE_TOKEN: verification-edge-token-0001
          INGOT_OPERATOR_TOKEN: verification-operator-token-0001
          INGOT_CONNECTOR_TOKEN: verification-connector-token-0001
          INGOT_CONNECTOR_LOCAL_TOKEN: verification-connector-local-token-0001
        run: |
          docker compose -f docker-compose.app.yml --profile connector-host up -d --no-build --wait
          curl --fail --silent http://127.0.0.1:3000/health
          curl --fail --silent http://127.0.0.1:8000/health
          curl --fail --silent http://127.0.0.1:8001/health

      - name: Build public-site images
        run: docker compose -f deploy/compose.yml --profile site --profile docs build site docs

      - name: Stop application stack
        if: always()
        env:
          INGOT_POSTGRES_PASSWORD: verification-postgres-password
          INGOT_SITE_ID: verification-site-0001
          INGOT_EDGE_ID: verification-edge-0001
          INGOT_EDGE_TOKEN: verification-edge-token-0001
          INGOT_OPERATOR_TOKEN: verification-operator-token-0001
          INGOT_CONNECTOR_TOKEN: verification-connector-token-0001
          INGOT_CONNECTOR_LOCAL_TOKEN: verification-connector-local-token-0001
        run: docker compose -f docker-compose.app.yml down -v --remove-orphans
