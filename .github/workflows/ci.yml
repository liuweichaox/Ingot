# 构建、测试、浏览器回归并验证可部署制品的主 CI 流水线。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: |
            apps/platform/package-lock.json
            apps/website/package-lock.json
            apps/docs-site/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: optimizer/uv.lock

      - name: Install browser regression runtime
        run: |
          npm --prefix apps/platform ci
          npm --prefix apps/platform exec -- playwright install --with-deps chromium

      - name: Verify repository
        env:
          INGOT_VERIFY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/verify.sh

      - name: Build application images
        env:
          INGOT_POSTGRES_PASSWORD: verification-postgres-password
          INGOT_SITE_ID: verification-site-0001
          INGOT_EDGE_ID: verification-edge-0001
          INGOT_EDGE_TOKEN: verification-edge-token-0001
          INGOT_OPERATOR_TOKEN: verification-operator-token-0001
          INGOT_CONNECTOR_TOKEN: verification-connector-token-0001
          INGOT_CONNECTOR_LOCAL_TOKEN: verification-connector-local-token-0001
        run: docker compose -f docker-compose.app.yml --profile connector-host build

      - name: Smoke application stack
        env:
          INGOT_POSTGRES_PASSWORD: verification-postgres-password
          INGOT_SITE_ID: verification-site-0001
          INGOT_EDGE_ID: verification-edge-0001
          INGOT_EDGE_TOKEN: verification-edge-token-0001
          INGOT_OPERATOR_TOKEN: verification-operator-token-0001
          INGOT_CONNECTOR_TOKEN: verification-connector-token-0001
          INGOT_CONNECTOR_LOCAL_TOKEN: verification-connector-local-token-0001
        run: |
          docker compose -f docker-compose.app.yml --profile connector-host up -d --no-build --wait
          curl --fail --silent http://127.0.0.1:3000/health
          curl --fail --silent http://127.0.0.1:8000/health
          curl --fail --silent http://127.0.0.1:8001/health
          curl --fail --silent http://127.0.0.1:8002/health
          curl --fail --silent http://127.0.0.1:8002/metrics | grep -Fq platform_worker_heartbeat_timestamp_seconds
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/metrics)" = 404
          curl --fail --silent --head http://127.0.0.1:3000/ | tr -d '\r' | grep -Fq 'X-Frame-Options: DENY'
          curl --fail --silent --head http://127.0.0.1:3000/auth/silent-callback | tr -d '\r' | grep -Fq 'X-Frame-Options: SAMEORIGIN'
          curl --fail --silent --head http://127.0.0.1:3000/auth/silent-callback | tr -d '\r' | grep -Fq "frame-ancestors 'self'"

      - name: Build public-site images
        run: docker compose -f deploy/compose.yml --profile site --profile docs build site docs

      - name: Smoke final public-site images
        run: |
          cleanup_public_sites() {
            docker rm --force ingot-site-smoke ingot-docs-smoke >/dev/null 2>&1 || true
          }
          trap cleanup_public_sites EXIT
          docker run --detach --name ingot-site-smoke --publish 127.0.0.1:38080:80 ingot-site:local
          docker run --detach --name ingot-docs-smoke --publish 127.0.0.1:38081:80 ingot-docs:local

          for port in 38080 38081; do
            for attempt in $(seq 1 30); do
              if curl --fail --silent "http://127.0.0.1:${port}/healthz" >/dev/null; then
                break
              fi
              if [[ "$attempt" == 30 ]]; then
                echo "Public image on port ${port} did not become healthy." >&2
                exit 1
              fi
              sleep 1
            done
          done

          site_html="$(curl --fail --silent http://127.0.0.1:38080/)"
          site_asset="$(grep -oE '/_next/static/[^"[:space:]]+\.(css|js)' <<<"$site_html" | sed -n '1p')"
          test -n "$site_asset"
          curl --fail --silent "http://127.0.0.1:38080${site_asset}" >/dev/null

          docs_html="$(curl --fail --silent http://127.0.0.1:38081/zh/)"
          docs_asset="$(grep -oE '/_next/static/[^"[:space:]]+\.(css|js)' <<<"$docs_html" | sed -n '1p')"
          test -n "$docs_asset"
          curl --fail --silent "http://127.0.0.1:38081${docs_asset}" >/dev/null
          curl --fail --silent http://127.0.0.1:38081/search-index.json >/dev/null

      - name: Stop application stack
        if: always()
        env:
          INGOT_POSTGRES_PASSWORD: verification-postgres-password
          INGOT_SITE_ID: verification-site-0001
          INGOT_EDGE_ID: verification-edge-0001
          INGOT_EDGE_TOKEN: verification-edge-token-0001
          INGOT_OPERATOR_TOKEN: verification-operator-token-0001
          INGOT_CONNECTOR_TOKEN: verification-connector-token-0001
          INGOT_CONNECTOR_LOCAL_TOKEN: verification-connector-local-token-0001
        run: docker compose -f docker-compose.app.yml down -v --remove-orphans
