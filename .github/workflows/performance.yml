# 定期运行性能基准与公开数据验证，只读取源码并上传验证制品。
name: Performance

on:
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * 0"

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Ingot.sln

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: optimizer/uv.lock

      - name: Benchmark edge event log
        run: ./scripts/benchmark-edge-event-log.sh

      - name: Benchmark platform ingest
        run: ./scripts/benchmark-platform-ingest.sh

      - name: Verify frozen acceptance protocol integrity
        run: |
          mkdir -p artifacts
          ./scripts/verify-optimizer-acceptance.sh > artifacts/optimizer-acceptance-integrity.json

      - name: Benchmark optimizer development regression
        run: ./scripts/benchmark-optimizer-development.sh artifacts/optimizer-development.json

      - name: Verify optimizer evidence boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          integrity = json.loads(Path("artifacts/optimizer-acceptance-integrity.json").read_text())
          assert integrity["schema"] == "ingot-optimizer-acceptance-protocol"
          assert integrity["status"] == "frozen"
          assert integrity["evaluation_unit_count"] == 3
          assert integrity["full_evaluation_allowed"] is False

          result = json.loads(Path("artifacts/optimizer-development.json").read_text())
          assert result["schema"] == "ingot-optimizer-development-regression"
          assert result["evidence_status"] == "development-regression-only"
          assert result["source_evidence"] == "inspected-fresh-data-acceptance"
          assert result["summary"]["source_dataset_count"] == 3
          assert result["summary"]["evaluation_unit_count"] == 3
          assert result["summary"]["episode_count"] == 450
          assert result["summary"]["all_evaluation_units_complete"] is True
          assert result["summary"]["all_initial_designs_unique"] is True
          PY

      - name: Upload optimizer evidence
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-evidence
          path: |
            artifacts/optimizer-acceptance-integrity.json
            artifacts/optimizer-development.json
