name: Performance

on:
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * 0"

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Ingot.sln

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: optimizer/uv.lock

      - name: Benchmark edge event log
        run: ./scripts/benchmark-edge-event-log.sh

      - name: Benchmark platform ingest
        run: ./scripts/benchmark-platform-ingest.sh

      - name: Benchmark v2 public-data development regression
        run: ./scripts/benchmark-public-validation.sh public-validation.json

      - name: Verify v3 external-data evaluation candidate
        run: ./scripts/verify-public-validation-v3.sh

      - name: Verify public-data claim boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("public-validation.json").read_text())
          assert result["schema"] == "ingot-public-validation-v2"
          assert result["summary"]["workflow_validation"] == "passed"
          assert result["summary"]["dataset_count"] == 2
          assert result["summary"]["scenario_count"] == 14
          assert result["summary"]["all_initial_designs_unique"] is True
          assert result["summary"]["experiment_reduction_vs_uninformed_search"] in {
              "passed-public-benchmark",
              "not-demonstrated",
          }
          assert result["summary"]["active_comparator_noninferiority"] in {
              "passed-public-benchmark",
              "not-demonstrated",
          }
          assert result["summary"]["experiment_reduction_claim"] in {
              "passed-vs-seeded-random-search",
              "not-demonstrated",
          }
          PY

      - name: Upload public-data result
        uses: actions/upload-artifact@v4
        with:
          name: public-validation
          path: public-validation.json
