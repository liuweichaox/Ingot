# 每周检查 .NET、前端、容器基础镜像和 GitHub Actions 依赖更新。
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      dotnet:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/platform
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/website
    schedule:
      interval: weekly
    groups:
      website:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/docs-site
    schedule:
      interval: weekly
    groups:
      docs-site:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /
      - /apps/platform
      - /deploy
      - /deploy/docker
      - /optimizer
      - /src/edge/Ingot.Edge.ConnectorHost
      - /src/platform/Ingot.Platform.Api
      - /src/platform/Ingot.Platform.Migrator
      - /src/platform/Ingot.Platform.Worker
      - /tools/semiconductor-etch-simulator
    schedule:
      interval: weekly
    groups:
      shared-base-images:
        patterns: ["*"]
        group-by: dependency-name

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
