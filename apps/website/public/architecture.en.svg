    <g fill="#82958e" font-size="8" text-anchor="middle" letter-spacing=".5"><text x="265" y="286">FACTS</text><text x="537" y="286">EVENTS</text><text x="964" y="182">WEB</text><text x="964" y="321">MODEL</text><text x="964" y="457">TOOLS</text></g>
    <g transform="translate(42 628)"><rect width="1196" height="54" rx="11" fill="#151b14" stroke="#e8ad56" stroke-opacity=".65"/><path d="M24 15l12 6v10c0 9-5 15-12 18-7-3-12-9-12-18V21z" fill="none" stroke="#e8ad56" stroke-width="1.5"/><path d="M18 31l4 4 8-10" fill="none" stroke="#e8ad56" stroke-width="1.5"/><text x="55" y="25" fill="#e8ad56" font-size="12" font-weight="700" letter-spacing="1">EQUIPMENT-CONTROL BOUNDARY</text><text x="55" y="43" fill="#afc0ba" font-size="12">Agent and Optimizer never connect to equipment; engineers review proposals and controlled experiments validate them before any formal conclusion.</text></g>
  </g>
</svg>
