<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Ingot: real runs, testable evidence</title>
  <desc id="desc">Ingot open-source industrial process optimization brand graphic, with a simple circular data visualization showing the evidence loop from real runs through comparison and validation to a bounded operating region.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050c0a"/><stop offset="1" stop-color="#0a1713"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd68f"/><stop offset="1" stop-color="#e8a646"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#5fd4c8" stop-opacity=".18"/><stop offset="1" stop-color="#5fd4c8" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#5fd4c8" stroke-opacity=".045"/></pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#5fd4c8"/></marker>
  </defs>
  <rect width="1200" height="630" rx="20" fill="url(#bg)"/><rect x="600" width="600" height="630" fill="url(#grid)"/><circle cx="918" cy="316" r="300" fill="url(#halo)"/><path d="M32 18h1136l14 14v566l-14 14H32l-14-14V32z" fill="none" stroke="#e8ad56" stroke-opacity=".64"/>
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif">
    <g transform="translate(66 70)">
      <text fill="#5fd4c8" font-size="13" font-weight="700" letter-spacing="3">OPEN SOURCE / PROCESS R&amp;D</text><text y="96" fill="url(#gold)" font-size="88" font-weight="760" letter-spacing="3">INGOT</text>
      <path d="M2 126h76" stroke="#e8ad56" stroke-width="3"/><path d="M90 126h250" stroke="#5fd4c8" stroke-opacity=".34"/>
      <text y="203" fill="#f0f4f2" font-size="42" font-weight="720">REAL RUNS.</text><text y="260" fill="#f0f4f2" font-size="42" font-weight="720">TESTABLE EVIDENCE.</text>
      <text y="319" fill="#9fb0aa" font-size="15">Connect conditions, process traces, and quality outcomes</text><text y="347" fill="#9fb0aa" font-size="15">to compare differences and design the next validation.</text>
      <g transform="translate(0 423)" fill="#8da19a" font-size="11" font-weight="650" letter-spacing="1.5"><text>OBSERVE</text><circle cx="78" cy="-4" r="2" fill="#e8ad56"/><text x="96">COMPARE</text><circle cx="184" cy="-4" r="2" fill="#e8ad56"/><text x="202">VALIDATE</text><circle cx="288" cy="-4" r="2" fill="#e8ad56"/><text x="306">PRESERVE</text></g>
    </g>
    <g transform="translate(0 2)">
      <circle cx="918" cy="314" r="181" fill="#07110e" fill-opacity=".6" stroke="#5fd4c8" stroke-opacity=".24"/><circle cx="918" cy="314" r="151" fill="none" stroke="#5fd4c8" stroke-opacity=".16" stroke-dasharray="3 8"/>
      <g fill="none" stroke="#5fd4c8" stroke-width="2.3" stroke-linecap="round" marker-end="url(#arrow)" opacity=".85"><path d="M941 135a181 181 0 0 1 154 155"/><path d="M1097 337a181 181 0 0 1-155 155"/><path d="M895 493a181 181 0 0 1-155-155"/><path d="M739 290a181 181 0 0 1 155-155"/></g>
      <g transform="translate(918 314)"><ellipse rx="112" ry="66" fill="#07100e" stroke="#5fd4c8" stroke-opacity=".42"/><ellipse rx="84" ry="49" fill="none" stroke="#5fd4c8" stroke-opacity=".5"/><ellipse rx="56" ry="32" fill="none" stroke="#e8ad56" stroke-opacity=".66"/><ellipse rx="25" ry="14" fill="#e8ad56" fill-opacity=".16" stroke="#ffd08a"/><ellipse rx="8" ry="5" fill="#ffd08a" filter="url(#glow)"/><text y="98" fill="#f0f4f2" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">OPERATING REGION</text><text y="120" fill="#82958e" font-size="10" text-anchor="middle">scope · evidence · failure conditions</text></g>
      <g transform="translate(918 114)"><circle r="38" fill="#0c1915" stroke="#5fd4c8" stroke-width="1.5"/><path d="M-19 8l10-13 10 7L11-13l10 9" fill="none" stroke="#5fd4c8" stroke-width="2"/><path d="M-19 16l11-5 9 3 10-8 10 5" fill="none" stroke="#e8ad56" stroke-width="1.5"/><text y="-51" fill="#9fb0aa" font-size="10" font-weight="700" letter-spacing="1.3" text-anchor="middle">REAL RUN</text></g>
      <g transform="translate(1118 314)"><circle r="38" fill="#0c1915" stroke="#5fd4c8" stroke-width="1.5"/><circle r="20" fill="none" stroke="#5fd4c8" stroke-opacity=".5"/><circle r="11" fill="none" stroke="#e8ad56"/><circle r="4" fill="#e8ad56"/><text y="61" fill="#9fb0aa" font-size="10" font-weight="700" letter-spacing="1.3" text-anchor="middle">COMPARE</text></g>
      <g transform="translate(918 514)"><circle r="38" fill="#0c1915" stroke="#5fd4c8" stroke-width="1.5"/><path d="M-20 15l11-12 9 6 11-20 11 6" fill="none" stroke="#5fd4c8" stroke-width="2"/><path d="M-20 20L22-15" fill="none" stroke="#e8ad56" stroke-dasharray="4 4"/><text y="62" fill="#9fb0aa" font-size="10" font-weight="700" letter-spacing="1.3" text-anchor="middle">VALIDATE</text></g>
      <g transform="translate(718 314)"><circle r="38" fill="#0c1915" stroke="#e8ad56" stroke-width="1.5"/><path d="M-21 15l14-22 14 13 14-22M-21 15h42" fill="none" stroke="#5fd4c8" stroke-width="1.5"/><circle cx="7" cy="6" r="5" fill="#07100e" stroke="#e8ad56" stroke-width="2" filter="url(#glow)"/><text y="61" fill="#9fb0aa" font-size="10" font-weight="700" letter-spacing="1.3" text-anchor="middle">NEXT EXPERIMENT</text></g>
    </g>
  </g>
</svg>
