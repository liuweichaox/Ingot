<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Ingot 系统架构</title>
  <desc id="desc">现场系统通过独立 Edge ConnectorHost 向 Platform 正式业务记录源提交运行事实。工程师通过 Web 工作台审核，Optimizer 提供无状态计算，Agent 通过授权只读工具组织证据。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07100e"/><stop offset="1" stop-color="#0b1714"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd08a"/><stop offset="1" stop-color="#e8ad56"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#5fd4c8" stroke-opacity=".045"/></pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="cyanArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#5fd4c8"/></marker>
    <marker id="goldArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#e8ad56"/></marker>
  </defs>
  <rect width="1280" height="720" rx="18" fill="url(#bg)"/><rect width="1280" height="720" rx="18" fill="url(#grid)"/>
  <path d="M30 16h1220l14 14v660l-14 14H30l-14-14V30z" fill="none" stroke="#e8ad56" stroke-opacity=".55"/>
  <g font-family="Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif">
    <text x="46" y="57" fill="url(#gold)" font-size="24" font-weight="750" letter-spacing="2">INGOT / 系统架构</text>
    <text x="1234" y="56" fill="#82958e" font-size="12" text-anchor="end">可信事实 → 工程判断 → 受控验证</text>
    <g transform="translate(42 96)">
      <rect width="204" height="494" rx="14" fill="#091512" stroke="#334841"/>
      <text x="20" y="35" fill="#edf1f5" font-size="16" font-weight="700">现场与业务系统</text><text x="20" y="57" fill="#82958e" font-size="11" letter-spacing="1">既有事实来源</text>
      <g transform="translate(18 82)" font-size="13">
        <g><rect width="168" height="54" rx="9" fill="#0d1d19" stroke="#29443c"/><path d="M17 17v20m9-13v13m9-7v7" stroke="#5fd4c8" stroke-width="2"/><text x="52" y="33" fill="#d9e3df">PLC / DCS</text></g>
        <g transform="translate(0 66)"><rect width="168" height="54" rx="9" fill="#0d1d19" stroke="#29443c"/><circle cx="27" cy="27" r="10" fill="none" stroke="#5fd4c8"/><path d="M27 27l7-6" stroke="#e8ad56" stroke-width="2"/><text x="52" y="33" fill="#d9e3df">仪器与传感器</text></g>
        <g transform="translate(0 132)"><rect width="168" height="54" rx="9" fill="#0d1d19" stroke="#29443c"/><path d="M15 27c8-12 18-12 26 0-8 12-18 12-26 0z" fill="none" stroke="#5fd4c8"/><circle cx="28" cy="27" r="4" fill="#e8ad56"/><text x="52" y="33" fill="#d9e3df">视觉与检测</text></g>
        <g transform="translate(0 198)"><rect width="168" height="54" rx="9" fill="#0d1d19" stroke="#29443c"/><path d="M18 17h18v20H18zm4 5h10m-10 5h10m-10 5h7" fill="none" stroke="#5fd4c8"/><text x="52" y="33" fill="#d9e3df">QMS / LIMS</text></g>
        <g transform="translate(0 264)"><rect width="168" height="54" rx="9" fill="#0d1d19" stroke="#29443c"/><path d="M18 20h20M18 27h20M18 34h20" stroke="#5fd4c8"/><circle cx="23" cy="20" r="2" fill="#e8ad56"/><circle cx="31" cy="27" r="2" fill="#e8ad56"/><circle cx="26" cy="34" r="2" fill="#e8ad56"/><text x="52" y="33" fill="#d9e3df">MES 与业务来源</text></g>
      </g><text x="102" y="469" fill="#82958e" font-size="11" text-anchor="middle">不替代控制与执行系统</text>
    </g>
    <g transform="translate(286 96)">
      <rect width="232" height="494" rx="14" fill="#091512" stroke="#37675e"/><text x="20" y="35" fill="#5fd4c8" font-size="12" font-weight="700" letter-spacing="2">现场进程</text>
      <rect x="18" y="76" width="196" height="238" rx="12" fill="#0d1d19" stroke="#5fd4c8" stroke-width="1.5"/><text x="36" y="111" fill="#edf1f5" font-size="17" font-weight="700">Edge ConnectorHost</text>
      <g fill="#afc0ba" font-size="13"><text x="36" y="148">协议适配与单位转换</text><text x="36" y="180">字段映射与稳定标识</text><text x="36" y="212">运行边界与过程事件</text><text x="36" y="244">配置缓存与应用回报</text></g>
      <g transform="translate(18 338)"><rect width="196" height="94" rx="11" fill="#0d1d19" stroke="#e8ad56" stroke-opacity=".7"/><path d="M23 29h30v32H23zm6-8h18v8H29" fill="none" stroke="#e8ad56" stroke-width="2"/><text x="68" y="39" fill="#e8ad56" font-size="14" font-weight="700">本地持久队列</text><text x="68" y="62" fill="#afc0ba" font-size="12">断网缓存 · 重传 · 隔离</text></g>
      <text x="116" y="468" fill="#82958e" font-size="11" text-anchor="middle">独立进程 · 存储 · 恢复生命周期</text>
    </g>
    <g transform="translate(558 78)">
      <rect width="386" height="530" rx="15" fill="#091512" stroke="#e8ad56" stroke-opacity=".72"/><text x="20" y="36" fill="#e8ad56" font-size="12" font-weight="700" letter-spacing="2">厂内正式业务记录源</text>
      <rect x="18" y="58" width="350" height="76" rx="11" fill="#132019" stroke="#e8ad56" stroke-width="1.5"/><text x="36" y="89" fill="#edf1f5" font-size="18" font-weight="700">Platform API</text><text x="36" y="113" fill="#afc0ba" font-size="12">授权 · 业务状态 · 证据装配 · 审计</text>
      <g transform="translate(18 154)" font-size="13">
        <g><rect width="168" height="72" rx="10" fill="#0d1d19" stroke="#315047"/><text x="18" y="29" fill="#5fd4c8" font-weight="700">生产运行</text><text x="18" y="51" fill="#afc0ba">执行 · 阶段 · 轨迹</text></g>
        <g transform="translate(182)"><rect width="168" height="72" rx="10" fill="#0d1d19" stroke="#315047"/><text x="18" y="29" fill="#5fd4c8" font-weight="700">制造上下文</text><text x="18" y="51" fill="#afc0ba">设备 · 产品 · 工装</text></g>
        <g transform="translate(0 86)"><rect width="168" height="72" rx="10" fill="#0d1d19" stroke="#315047"/><text x="18" y="29" fill="#5fd4c8" font-weight="700">质量与检验</text><text x="18" y="51" fill="#afc0ba">结果 · 复核 · 偏差</text></g>
        <g transform="translate(182 86)"><rect width="168" height="72" rx="10" fill="#0d1d19" stroke="#315047"/><text x="18" y="29" fill="#5fd4c8" font-weight="700">工艺研发</text><text x="18" y="51" fill="#afc0ba">假设 · 实验 · 操作域</text></g>
      </g>
      <g transform="translate(18 338)"><rect width="350" height="62" rx="10" fill="#0d1d19" stroke="#5fd4c8" stroke-opacity=".55"/><text x="18" y="27" fill="#5fd4c8" font-size="13" font-weight="700">确定性分析与证据快照</text><text x="18" y="47" fill="#afc0ba" font-size="11">数据质量 · 匹配比较 · 特征统计 · 来源版本</text></g>
      <g transform="translate(18 414)"><rect width="224" height="82" rx="10" fill="#0d1d19" stroke="#e8ad56" stroke-opacity=".6"/><path d="M18 24c0-7 10-12 22-12s22 5 22 12v32c0 7-10 12-22 12s-22-5-22-12zM18 24c0 7 10 12 22 12s22-5 22-12m-22 28c-12 0-22-5-22-12" fill="none" stroke="#e8ad56"/><text x="78" y="30" fill="#edf1f5" font-size="11" font-weight="700">PostgreSQL</text><text x="78" y="47" fill="#edf1f5" font-size="11" font-weight="700">+ TimescaleDB</text><text x="78" y="65" fill="#afc0ba" font-size="10">正式记录 · 时序数据</text></g>
      <g transform="translate(256 414)"><rect width="112" height="82" rx="10" fill="#0d1d19" stroke="#315047"/><path d="M18 25h28l7 8v25H18z" fill="none" stroke="#5fd4c8"/><text x="62" y="34" fill="#edf1f5" font-size="11">附件</text><text x="62" y="53" fill="#afc0ba" font-size="10">工艺知识</text></g>
    </g>
    <g transform="translate(984 96)">
      <rect width="254" height="494" rx="14" fill="#091512" stroke="#334841"/><text x="20" y="35" fill="#edf1f5" font-size="16" font-weight="700">工程判断与计算</text>
      <g transform="translate(18 70)"><rect width="218" height="88" rx="11" fill="#0d1d19" stroke="#5fd4c8"/><circle cx="32" cy="31" r="11" fill="none" stroke="#e8ad56"/><path d="M15 65c4-18 30-18 34 0" fill="none" stroke="#e8ad56"/><text x="66" y="30" fill="#edf1f5" font-size="14" font-weight="700">工艺工程师</text><text x="66" y="55" fill="#afc0ba" font-size="12">Platform Web 工作台</text></g>
      <g transform="translate(18 182)"><rect width="218" height="112" rx="11" fill="#0d1d19" stroke="#e8ad56" stroke-opacity=".8"/><path d="M20 70l22-20 20 9 25-31" fill="none" stroke="#e8ad56" stroke-width="2"/><circle cx="87" cy="28" r="4" fill="#e8ad56" filter="url(#glow)"/><text x="108" y="35" fill="#edf1f5" font-size="14" font-weight="700">Optimizer</text><text x="108" y="57" fill="#afc0ba" font-size="11">DOE · 响应面</text><text x="108" y="76" fill="#afc0ba" font-size="11">GP/BO · 参数建议</text><text x="20" y="96" fill="#e8ad56" font-size="10" letter-spacing="1">无业务状态 · 不批准实验</text></g>
      <g transform="translate(18 318)"><rect width="218" height="112" rx="11" fill="#0d1d19" stroke="#5fd4c8" stroke-opacity=".8"/><path d="M20 27h31v24H31l-8 8v-8h-3z" fill="none" stroke="#5fd4c8"/><text x="67" y="34" fill="#edf1f5" font-size="14" font-weight="700">Agent</text><text x="67" y="57" fill="#afc0ba" font-size="11">查询 · 组织 · 解释</text><text x="20" y="88" fill="#5fd4c8" font-size="10" letter-spacing="1">授权只读工具 · 引用证据</text></g>
      <text x="127" y="469" fill="#82958e" font-size="11" text-anchor="middle">不形成平行业务记录</text>
    </g>
    <g fill="none" stroke="#5fd4c8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#cyanArrow)"><path d="M246 300h38"/><path d="M518 300h38"/><path d="M984 195h-40" marker-start="url(#cyanArrow)"/></g>
    <g fill="none" stroke="#e8ad56" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#goldArrow)"><path d="M984 334h-40" marker-start="url(#goldArrow)"/></g>
    <g fill="none" stroke="#5fd4c8" stroke-width="2" stroke-dasharray="4 6" marker-end="url(#cyanArrow)"><path d="M984 470h-40" marker-start="url(#cyanArrow)"/></g>
    <g fill="#82958e" font-size="8" text-anchor="middle" letter-spacing=".5"><text x="265" y="286">事实</text><text x="537" y="286">事件</text><text x="964" y="182">WEB</text><text x="964" y="321">模型</text><text x="964" y="457">工具</text></g>
    <g transform="translate(42 628)"><rect width="1196" height="54" rx="11" fill="#151b14" stroke="#e8ad56" stroke-opacity=".65"/><path d="M24 15l12 6v10c0 9-5 15-12 18-7-3-12-9-12-18V21z" fill="none" stroke="#e8ad56" stroke-width="1.5"/><path d="M18 31l4 4 8-10" fill="none" stroke="#e8ad56" stroke-width="1.5"/><text x="55" y="25" fill="#e8ad56" font-size="12" font-weight="700" letter-spacing="1">设备控制边界</text><text x="55" y="43" fill="#afc0ba" font-size="12">Agent 与 Optimizer 不直连设备；参数建议须经工程师审核，并由受控实验验证后才能形成正式结论。</text></g>
  </g>
</svg>
