server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 110m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' ${INGOT_OIDC_ALLOWED_ORIGINS}; frame-src 'self' ${INGOT_OIDC_ALLOWED_ORIGINS}; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # oidc-client-ts 在同源 iframe 中完成静默续期；只允许这个精确回调被同源页面嵌入。
    location = /auth/silent-callback {
        root /usr/share/nginx/html;
        try_files /index.html =404;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' ${INGOT_OIDC_ALLOWED_ORIGINS}; frame-src 'self' ${INGOT_OIDC_ALLOWED_ORIGINS}; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    }

    # 前端静态文件
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # 反向代理 API
    location /api/ {
        proxy_pass http://platform-api:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 指标只允许 Prometheus 通过 Compose 内网直连 API，不进入用户端点。
    location = /metrics {
        return 404;
    }

    # 健康检查
    location /health {
        proxy_pass http://platform-api:8000;
    }
}
