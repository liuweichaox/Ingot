route:
  receiver: operator-required
  group_by: [alertname, site, edge]
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h

# This checked-in receiver deliberately has no external delivery target. A production
# deployment must mount a site-owned Alertmanager file and record routing evidence in
# scripts/verify-production-acceptance.sh.
receivers:
  - name: operator-required
