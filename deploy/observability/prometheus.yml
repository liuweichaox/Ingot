global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: ingot-platform
    metrics_path: /metrics
    static_configs:
      - targets: ["platform-api:8000"]

  - job_name: ingot-edge
    metrics_path: /metrics
    file_sd_configs:
      - files: ["/etc/prometheus/targets/edge-targets.yml"]

  - job_name: ingot-postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
