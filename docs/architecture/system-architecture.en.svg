  <text x="312" y="216" font-size="11.5" fill="#475569">configure · review · confirm</text>
  <line x1="1115" y1="198" x2="1115" y2="282" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
  <text x="1102" y="216" font-size="11.5" fill="#475569" text-anchor="end">field acquisition</text>
  <line x1="300" y1="390" x2="300" y2="450" stroke="#0F766E" stroke-width="1.8" marker-start="url(#arrowTeal)" marker-end="url(#arrowTeal)"/>
  <text x="312" y="425" font-size="11.5" fill="#0F766E">HTTPS / JSON</text>
  <line x1="1110" y1="390" x2="1110" y2="450" stroke="#0F766E" stroke-width="1.8" marker-start="url(#arrowTeal)" marker-end="url(#arrowTeal)"/>
  <text x="1098" y="414" font-size="11" fill="#0F766E" text-anchor="end">events/heartbeat upstream</text>
  <text x="1098" y="432" font-size="11" fill="#0F766E" text-anchor="end">configuration/diagnostics calls</text>

