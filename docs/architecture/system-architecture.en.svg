<svg viewBox="0 80 1440 990" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif">
  <defs>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0F766E"/></marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A16207"/></marker>
  </defs>

  <rect width="1440" height="1070" fill="#FFFFFF"/>

  <g>
    <rect x="130" y="112" width="340" height="86" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="148" y="126" width="134" height="18" rx="9" fill="#64748B"/>
    <text x="215" y="139" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">EXTERNAL · PEOPLE</text>
    <text x="300" y="164" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">Process Engineer</text>
    <text x="300" y="183" font-size="10.5" fill="#64748B" text-anchor="middle">sets goals and bounds · confirms recipes</text>
    <text x="300" y="196" font-size="10.5" fill="#64748B" text-anchor="middle">reviews suggestions and links actual runs</text>
  </g>
  <g>
    <rect x="920" y="112" width="390" height="86" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 5"/>
    <rect x="938" y="126" width="118" height="18" rx="9" fill="#64748B"/>
    <text x="997" y="139" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">EXTERNAL · FIELD</text>
    <text x="1115" y="164" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">Field Data Sources</text>
    <text x="1115" y="183" font-size="10.5" fill="#64748B" text-anchor="middle">controls · instruments · vision · inspection</text>
    <text x="1115" y="196" font-size="10.5" fill="#64748B" text-anchor="middle">MES/QMS/LIMS when integrated</text>
  </g>

  <rect x="60" y="250" width="1320" height="800" rx="18" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.8"/>

  <g>
    <rect x="120" y="284" width="360" height="106" rx="12" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.5"/>
    <rect x="138" y="298" width="70" height="18" rx="9" fill="#0F766E"/>
    <text x="173" y="311" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">PLATFORM</text>
    <text x="300" y="342" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">Platform Web</text>
    <text x="300" y="362" font-size="12" fill="#334155" text-anchor="middle">Engineering workbench · static React application</text>
    <text x="462" y="380" font-size="10.5" font-family="ui-monospace, Menlo, monospace" fill="#94A3B8" text-anchor="end">apps/platform</text>
  </g>
  <g>
    <rect x="900" y="284" width="420" height="106" rx="12" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
    <rect x="918" y="298" width="52" height="18" rx="9" fill="#0F766E"/>
    <text x="944" y="311" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">EDGE</text>
    <text x="1110" y="340" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">Edge ConnectorHost</text>
    <text x="1110" y="360" font-size="12" fill="#334155" text-anchor="middle">Protocol mapping · run detection · acquisition and replay</text>
    <text x="1110" y="378" font-size="11" fill="#64748B" text-anchor="middle">Local SQLite: outbox · logs · configuration cache</text>
    <text x="1302" y="380" font-size="10.5" font-family="ui-monospace, Menlo, monospace" fill="#94A3B8" text-anchor="end">src/edge</text>
  </g>

  <g>
    <rect x="150" y="452" width="1140" height="222" rx="14" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/>
    <rect x="172" y="470" width="70" height="18" rx="9" fill="#0F766E"/>
    <text x="207" y="483" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">PLATFORM</text>
    <text x="720" y="491" font-size="23" font-weight="800" fill="#0F172A" text-anchor="middle">Platform API</text>
    <text x="720" y="514" font-size="13" fill="#334155" text-anchor="middle">Factory system of record · authentication and authorization · evidence assembly for one real run</text>

    <rect x="182" y="540" width="326" height="92" rx="10" fill="#FFFFFF" stroke="#5FD4C8" stroke-width="1.3"/>
    <text x="345" y="566" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Records and optimization orchestration</text>
    <text x="345" y="586" font-size="11" fill="#64748B" text-anchor="middle">runs · inspections · optimization observations</text>
    <text x="345" y="604" font-size="11" fill="#64748B" text-anchor="middle">recipe recommendations · decisions · audit</text>
    <text x="345" y="622" font-size="10.5" fill="#94A3B8" text-anchor="middle">Application + Infrastructure</text>

    <rect x="557" y="540" width="326" height="92" rx="10" fill="#FFFFFF" stroke="#5FD4C8" stroke-width="1.3"/>
    <text x="720" y="566" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Deterministic analysis (in API process)</text>
    <text x="720" y="586" font-size="11" fill="#64748B" text-anchor="middle">quality admission · matching · comparison · features</text>
    <text x="720" y="604" font-size="11" fill="#64748B" text-anchor="middle">reviewable statistics and evidence explanation</text>
    <text x="720" y="622" font-size="10.5" fill="#94A3B8" text-anchor="middle">not a separate service</text>

    <rect x="932" y="540" width="326" height="92" rx="10" fill="#FFFFFF" stroke="#E8AD56" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="1095" y="566" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Agent (optional, in API process)</text>
    <text x="1095" y="586" font-size="11" fill="#64748B" text-anchor="middle">question parsing · authorized read-only tools · evidence</text>
    <text x="1095" y="604" font-size="11" fill="#64748B" text-anchor="middle">run snapshots stored in Platform PostgreSQL</text>
    <text x="1095" y="622" font-size="10.5" fill="#94A3B8" text-anchor="middle">src/agent · not a deployment unit</text>
  </g>

  <g>
    <rect x="100" y="738" width="360" height="112" rx="12" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.5"/>
    <rect x="118" y="752" width="70" height="18" rx="9" fill="#0F766E"/>
    <text x="153" y="765" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">PLATFORM</text>
    <text x="280" y="795" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">Platform Worker</text>
    <text x="280" y="814" font-size="11.5" fill="#334155" text-anchor="middle">projections and recompute · retention</text>
    <text x="280" y="831" font-size="11.5" fill="#334155" text-anchor="middle">result materialization · knowledge jobs</text>
    <text x="280" y="845" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#94A3B8" text-anchor="middle">independent background process · src/platform</text>
  </g>
  <g>
    <rect x="520" y="738" width="400" height="112" rx="12" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
    <rect x="538" y="752" width="70" height="18" rx="9" fill="#475569"/>
    <text x="573" y="765" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">DATABASE</text>
    <text x="720" y="795" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">PostgreSQL 17 + TimescaleDB extension</text>
    <text x="720" y="816" font-size="12" fill="#334155" text-anchor="middle">formal records · Agent snapshots · time-series events and process data</text>
    <text x="720" y="836" font-size="10.5" fill="#94A3B8" text-anchor="middle">one database service in the current Compose topology</text>
  </g>
  <g>
    <rect x="980" y="738" width="360" height="112" rx="12" fill="#FFFBEB" stroke="#A16207" stroke-width="1.5"/>
    <rect x="998" y="752" width="82" height="18" rx="9" fill="#A16207"/>
    <text x="1039" y="765" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">COMPUTE</text>
    <text x="1160" y="795" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">Optimizer</text>
    <text x="1160" y="816" font-size="12" fill="#334155" text-anchor="middle">recipe recommendation · diagnosis · production evidence input</text>
    <text x="1160" y="836" font-size="10.5" font-family="ui-monospace, Menlo, monospace" fill="#94A3B8" text-anchor="middle">no business state · optimizer/ · Python + BoTorch</text>
  </g>

  <g>
    <rect x="100" y="910" width="360" height="104" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="118" y="924" width="78" height="18" rx="9" fill="#64748B"/>
    <text x="157" y="937" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">STARTUP</text>
    <text x="280" y="966" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">Platform Migrator</text>
    <text x="280" y="986" font-size="12" fill="#334155" text-anchor="middle">schema migration · first-user bootstrap · transaction lock</text>
    <text x="280" y="1003" font-size="10.5" font-family="ui-monospace, Menlo, monospace" fill="#94A3B8" text-anchor="middle">one-shot job · API/Worker wait for completion</text>
  </g>
  <g>
    <rect x="960" y="910" width="380" height="104" rx="12" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
    <rect x="978" y="924" width="62" height="18" rx="9" fill="#475569"/>
    <text x="1009" y="937" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">FILES</text>
    <text x="1150" y="966" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">Persistent file volumes</text>
    <text x="1150" y="986" font-size="12" fill="#334155" text-anchor="middle">inspection attachments · process knowledge · archive volumes</text>
    <text x="1150" y="1003" font-size="10.5" fill="#94A3B8" text-anchor="middle">API/Worker access files; metadata remains in PostgreSQL</text>
  </g>

