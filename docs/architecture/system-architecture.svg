  <text x="312" y="216" font-size="11.5" fill="#475569">配置 · 审核 · 确认</text>
  <line x1="1115" y1="198" x2="1115" y2="282" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
  <text x="1102" y="216" font-size="11.5" fill="#475569" text-anchor="end">现场采集</text>
  <line x1="300" y1="390" x2="300" y2="450" stroke="#0F766E" stroke-width="1.8" marker-start="url(#arrowTeal)" marker-end="url(#arrowTeal)"/>
  <text x="312" y="425" font-size="11.5" fill="#0F766E">HTTPS / JSON</text>
  <line x1="1110" y1="390" x2="1110" y2="450" stroke="#0F766E" stroke-width="1.8" marker-start="url(#arrowTeal)" marker-end="url(#arrowTeal)"/>
  <text x="1098" y="414" font-size="11" fill="#0F766E" text-anchor="end">事件/心跳上送</text>
  <text x="1098" y="432" font-size="11" fill="#0F766E" text-anchor="end">配置/诊断调用</text>

  <path d="M1120,674 C1120,700 1160,700 1160,736" fill="none" stroke="#A16207" stroke-width="1.8" marker-start="url(#arrowAmber)" marker-end="url(#arrowAmber)"/>
  <text x="1180" y="706" font-size="11.5" fill="#A16207">HTTP 数值请求/结果</text>
  <line x1="720" y1="674" x2="720" y2="736" stroke="#64748B" stroke-width="1.8" marker-start="url(#arrowGray)" marker-end="url(#arrowGray)"/>
  <path d="M1240,674 C1240,700 1360,700 1360,760 L1360,858 C1360,886 1200,878 1170,908" fill="none" stroke="#64748B" stroke-width="1.8" marker-start="url(#arrowGray)" marker-end="url(#arrowGray)"/>
  <text x="1348" y="802" font-size="11" fill="#475569" text-anchor="end">附件/知识</text>
  <line x1="462" y1="794" x2="518" y2="794" stroke="#64748B" stroke-width="1.8" marker-start="url(#arrowGray)" marker-end="url(#arrowGray)"/>
  <text x="490" y="785" font-size="10.5" fill="#475569" text-anchor="middle">读写</text>
  <path d="M360,850 L360,878 L920,878 L1030,908" fill="none" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
  <text x="760" y="871" font-size="11" fill="#475569" text-anchor="middle">知识文件处理</text>
  <path d="M462,962 L490,962 L490,820 L518,820" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrowGray)"/>
  <text x="478" y="900" font-size="10.5" fill="#475569" text-anchor="end">迁移/引导</text>

</svg>
