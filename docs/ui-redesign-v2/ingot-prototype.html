<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ingot 工程工作台 · 前端重构原型 v2.1</title>
<style>
/* ============================================================
   Ingot Design Tokens v2.1 —— 依据 docs/brand.md 色板释义
   Evidence Gold  = 建议与待你决定（不是通用交互色）
   Trajectory Cyan = 过程、连接与可信状态
   Deep Coal / Process Panel / Fog = 深色主题的品牌底色
   ============================================================ */
:root{
  color-scheme: light;
  --bg:#f2f5f5; --surface:#ffffff; --surface-2:#f7faf9; --surface-3:#eaeeee;
  --line:#dfe5e4; --line-2:#c6cfce;
  --ink-1:#0d1613; --ink-2:#48544f; --ink-3:#7a8783; --ink-4:#a3aead;

  /* 金 = 需要人做决定。一屏上金色出现几次 = 有几件事等你 */
  --decide:#E8AD56; --decide-ink:#7a5307; --decide-wash:#fdf4e4; --decide-line:#f0cf96;
  --decide-on:#2a1c05;                     /* 金底上的文字 */
  /* 青 = 过程轨迹与可信状态（数据语义，不是交互） */
  --trace:#0f9c90; --trace-ink:#0a7168; --trace-wash:#e4f6f4; --trace-line:#a8ded8;
  /* 蓝 = 交互：链接、导航选中、通用主按钮 */
  --accent:#2a78d6; --accent-ink:#1c5cab; --accent-wash:#eaf2fd; --accent-line:#bcd8f8;

  /* 五态语义 */
  --good:#0ca30c;     --good-wash:#e7f6e7;     --good-ink:#0a7a0a;
  --caution:#e2703a;  --caution-wash:#fdefe8;  --caution-ink:#a24a1e;
  --critical:#d03b3b; --critical-wash:#fceded; --critical-ink:#a52a2a;
  --unknown:#8b97a3;  --unknown-wash:#eef1f3;  --unknown-ink:#5a6672;

  /* 图表分类色（validate_palette.js 全通过 · 底色 #ffffff） */
  --s1:#0f9c90; --s2:#eb6834; --s3:#2a78d6; --s4:#eda100; --s5:#e87ba4; --s6:#4a3aa7;
  --grid:#e6eae9; --axis:#c6cfce; --chart-surface:#ffffff;

  --shadow:0 1px 2px rgba(13,22,19,.05),0 4px 14px rgba(13,22,19,.06);
  --shadow-lg:0 8px 40px rgba(13,22,19,.18);
  --r:5px; --r-lg:8px;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#07100E; --surface:#0E1D19; --surface-2:#132621; --surface-3:#1b332c;
  --line:#1e352f; --line-2:#2c4840;
  --ink-1:#EEF5F1; --ink-2:#a3b5ae; --ink-3:#7a8b85; --ink-4:#5b6a65;

  --decide:#E8AD56; --decide-ink:#F0C784; --decide-wash:#2b2114; --decide-line:#5a4620;
  --decide-on:#2a1c05;
  --trace:#5FD4C8; --trace-ink:#8fe3da; --trace-wash:#0d2b27; --trace-line:#1d4a44;
  --accent:#4a94f0; --accent-ink:#8bbcf7; --accent-wash:#132437; --accent-line:#27466b;

  --good:#22b322;     --good-wash:#10240f;     --good-ink:#4fc94f;
  --caution:#ef8a55;  --caution-wash:#2c1a11;  --caution-ink:#f0996f;
  --critical:#e05252; --critical-wash:#2e1616; --critical-ink:#f07171;
  --unknown:#7d8b85;  --unknown-wash:#16211e;  --unknown-ink:#98a8a2;

  /* 深色分类色（validate_palette.js 全通过 · 底色 #0E1D19 = Process Panel） */
  --s1:#2da096; --s2:#d95926; --s3:#3987e5; --s4:#c98500; --s5:#d55181; --s6:#9085e9;
  --grid:#182b26; --axis:#2c4840; --chart-surface:#0E1D19;

  --shadow:0 1px 2px rgba(0,0,0,.5),0 4px 16px rgba(0,0,0,.4);
  --shadow-lg:0 8px 40px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink-1);overflow:hidden;
  font:400 13px/1.45 Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:var(--accent-ink);text-decoration:none}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.scroll::-webkit-scrollbar{width:9px;height:9px}
.scroll::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px;border:2px solid transparent;background-clip:content-box}
.tnum{font-variant-numeric:tabular-nums}
.mut{color:var(--ink-3)} .tiny{font-size:11px}
.row{display:flex;align-items:center;gap:8px} .wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1500px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:1200px){.g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px}
@media(max-width:1400px){.split{grid-template-columns:1fr}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-rows:52px 1fr 28px;height:100vh}
.topbar{display:flex;align-items:stretch;background:var(--surface);border-bottom:1px solid var(--line);z-index:40}
.brand{display:flex;align-items:center;width:56px;justify-content:center;flex:0 0 auto}
.mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(160deg,var(--decide),#c98a2e);display:grid;place-items:center;
  color:var(--decide-on);font-weight:800;font-size:12px}
.brandtext{display:flex;flex-direction:column;justify-content:center;padding-right:14px;border-right:1px solid var(--line);flex:0 0 auto}
.brandtext b{font-size:13px;line-height:1.1}
.brandtext small{font-size:10px;color:var(--ink-3);line-height:1.3}
.ctx{display:flex;align-items:center;padding:0 8px;flex:1 1 auto;min-width:0;overflow:hidden}
.ctxlabel{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-4);padding:0 8px 0 6px;white-space:nowrap}
.ctxchip{display:flex;align-items:center;gap:6px;height:28px;padding:0 9px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface-2);white-space:nowrap;max-width:220px}
.ctxchip:hover{border-color:var(--line-2);background:var(--surface-3)}
.ctxchip .k{font-size:10px;color:var(--ink-4)}
.ctxchip .v{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.ctxsep{width:1px;height:16px;background:var(--line);margin:0 6px;flex:0 0 auto}
.topact{display:flex;align-items:center;gap:2px;padding:0 8px;border-left:1px solid var(--line);flex:0 0 auto}
.iconbtn{width:30px;height:30px;border-radius:var(--r);display:grid;place-items:center;color:var(--ink-2);position:relative}
.iconbtn:hover{background:var(--surface-3);color:var(--ink-1)}
.iconbtn .dot{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--decide);border:1.5px solid var(--surface)}
.searchbtn{display:flex;align-items:center;gap:7px;height:28px;padding:0 8px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface-2);color:var(--ink-3);font-size:12px;min-width:170px}
.searchbtn:hover{border-color:var(--line-2)}
kbd{font:500 10px/1 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:3px 4px;color:var(--ink-4);background:var(--surface)}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-wash);color:var(--accent-ink);display:grid;place-items:center;font-size:10px;font-weight:700;border:1px solid var(--accent-line)}

.body{display:flex;min-height:0;overflow:hidden}
.rail{width:56px;flex:0 0 auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;z-index:30}
.railbtn{width:40px;height:40px;border-radius:var(--r-lg);display:grid;place-items:center;color:var(--ink-3);position:relative}
.railbtn:hover{background:var(--surface-3);color:var(--ink-1)}
.railbtn.on{background:var(--accent-wash);color:var(--accent-ink)}
.railbtn.on::before{content:"";position:absolute;left:-8px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.railbtn .n{position:absolute;top:3px;right:3px;min-width:15px;height:15px;padding:0 3px;border-radius:9px;background:var(--decide);
  color:var(--decide-on);font-size:9.5px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.railtip{position:absolute;left:52px;background:var(--ink-1);color:var(--surface);padding:4px 8px;border-radius:var(--r);font-size:11px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:.12s;z-index:60}
.railbtn:hover .railtip{opacity:1}
.railspacer{flex:1}

.subnav{width:228px;flex:0 0 auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.subnav.collapsed{display:none}
.subhead{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 14px;border-bottom:1px solid var(--line)}
.subhead b{font-size:12px}
.subbody{padding:8px 8px 16px;min-height:0}
.navgroup{margin-bottom:10px}
.navgroup .gl{font-size:10px;font-weight:600;letter-spacing:.6px;color:var(--ink-4);padding:6px 8px 4px}
.navitem{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:var(--r);color:var(--ink-2);font-size:12.5px;width:100%;text-align:left}
.navitem:hover{background:var(--surface-3);color:var(--ink-1)}
.navitem.on{background:var(--accent-wash);color:var(--accent-ink);font-weight:600}
.navitem .badge{margin-left:auto;font-size:10px;font-weight:600;padding:1px 5px;border-radius:20px;background:var(--surface-3);color:var(--ink-3);font-variant-numeric:tabular-nums}
.navitem .badge.gold{background:var(--decide);color:var(--decide-on)}
.navitem .new{margin-left:auto;font-size:9px;padding:1px 4px;border-radius:3px;background:var(--surface-3);color:var(--ink-3);font-weight:600}

.content{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.pagehead{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px 0;flex:0 0 auto}
.crumb{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-3);margin-bottom:3px}
.ptitle{display:flex;align-items:flex-start;gap:12px}
.ptitle h1{margin:0;font-size:17px;font-weight:650;letter-spacing:-.2px;line-height:1.3}
.ptitle p{margin:2px 0 0;font-size:11.5px;color:var(--ink-3);max-width:72ch}
.pacts{margin-left:auto;display:flex;align-items:center;gap:6px;flex:0 0 auto}
.tabs{display:flex;gap:2px;margin-top:9px}
.tab{height:31px;padding:0 10px;border-radius:var(--r) var(--r) 0 0;font-size:12.5px;color:var(--ink-3);position:relative;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--ink-1);background:var(--surface-2)}
.tab.on{color:var(--ink-1);font-weight:600}
.tab.on::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:2px;background:var(--accent);border-radius:2px 2px 0 0}
.tab .n{font-size:10px;padding:0 4px;border-radius:20px;background:var(--surface-3);color:var(--ink-3);line-height:15px;font-variant-numeric:tabular-nums}
.pagebody{flex:1 1 auto;min-height:0;padding:14px 16px 24px}

.inspector{width:376px;flex:0 0 auto;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.inspector.collapsed{display:none}
.insphead{height:38px;display:flex;align-items:center;gap:8px;padding:0 8px 0 14px;border-bottom:1px solid var(--line);flex:0 0 auto}
.inspbody{padding:12px 14px 24px;min-height:0}

.statusbar{display:flex;align-items:center;background:var(--surface);border-top:1px solid var(--line);padding:0 8px;font-size:11px;color:var(--ink-3);z-index:40}
.sitem{display:flex;align-items:center;gap:6px;padding:0 9px;height:28px;white-space:nowrap}
button.sitem:hover{background:var(--surface-3);color:var(--ink-1)}
.sdiv{width:1px;height:13px;background:var(--line)}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--good);animation:p 2.4s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(12,163,12,.45)}70%{box-shadow:0 0 0 5px rgba(12,163,12,0)}100%{box-shadow:0 0 0 0 rgba(12,163,12,0)}}
/* ---------- 按钮：金色只给"决定"，其余一律中性 ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--r);
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink-1);font-size:12.5px;font-weight:500;white-space:nowrap;transition:.12s}
.btn:hover{background:var(--surface-3);border-color:var(--ink-4)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-3);color:var(--ink-1)}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
/* 决定按钮：批准 / 采纳 / 发布 —— 一屏最多一个 */
.btn.decide{background:var(--decide);border-color:var(--decide);color:var(--decide-on);font-weight:650}
.btn.decide:hover{filter:brightness(1.06)}
/* 通用主按钮（蓝）：新建 / 开始 / 打开 —— 不是"决定" */
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.danger{color:var(--critical-ink);border-color:var(--critical-wash);background:var(--critical-wash)}
.btn.danger:hover{background:var(--critical);border-color:var(--critical);color:#fff}
.btngroup{display:inline-flex}
.btngroup .btn{border-radius:0;margin-left:-1px}
.btngroup .btn:first-child{border-radius:var(--r) 0 0 var(--r);margin-left:0}
.btngroup .btn:last-child{border-radius:0 var(--r) var(--r) 0}
.btngroup .btn.on{background:var(--accent-wash);border-color:var(--accent-line);color:var(--accent-ink);z-index:1}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card.gold{border-color:var(--decide-line);box-shadow:var(--shadow),0 0 0 3px var(--decide-wash)}
.card>.hd{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);min-height:38px}
.card>.hd h3{margin:0;font-size:12.5px;font-weight:650}
.card>.hd .sub{font-size:11px;color:var(--ink-3)}
.card>.hd .r{margin-left:auto;display:flex;align-items:center;gap:6px}
.card>.bd{padding:12px}
.card>.bd.flush{padding:0}
.card>.ft{padding:8px 12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-3)}

/* ---------- 状态标签：五态 + 决策色 + 溯源标 ---------- */
.tag{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap;line-height:1}
.tag svg{width:11px;height:11px}
.tag.good{background:var(--good-wash);color:var(--good-ink)}
.tag.caution{background:var(--caution-wash);color:var(--caution-ink)}
.tag.critical{background:var(--critical-wash);color:var(--critical-ink)}
.tag.unknown{background:var(--unknown-wash);color:var(--unknown-ink);
  background-image:repeating-linear-gradient(135deg,transparent 0 4px,rgba(139,151,163,.2) 4px 5px)}
.tag.decide{background:var(--decide-wash);color:var(--decide-ink);border:1px solid var(--decide-line)}
.tag.trace{background:var(--trace-wash);color:var(--trace-ink)}
.tag.plain{background:var(--surface-3);color:var(--ink-2)}
/* 机器提议 vs 人的决定 —— 虚线 vs 实线 */
.tag.machine{background:transparent;color:var(--decide-ink);border:1px dashed var(--decide-line)}
.tag.human{background:var(--decide-wash);color:var(--decide-ink);border:1px solid var(--decide);font-weight:700}
.dotm{width:7px;height:7px;border-radius:50%;flex:0 0 auto;display:inline-block}

table.dt{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
table.dt th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;font-size:11px;letter-spacing:.3px;
  color:var(--ink-3);padding:0 10px;height:30px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
table.dt td{padding:0 10px;height:32px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
table.dt tbody tr:hover td{background:var(--surface-2)}
table.dt tbody tr.sel td{background:var(--accent-wash)}
table.dt tbody tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
table.dt tbody tr.gold td{background:var(--decide-wash)}
table.dt tbody tr.gold td:first-child{box-shadow:inset 2px 0 0 var(--decide)}
table.dt td.num,table.dt th.num{text-align:right;font-variant-numeric:tabular-nums}
table.dt.compact td{height:28px}
.linkcell{color:var(--accent-ink);font-weight:500}
.linkcell:hover{text-decoration:underline}

.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12px;align-items:baseline}
.kv dt{color:var(--ink-3);white-space:nowrap}
.kv dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

.inp,select.inp,textarea.inp{height:28px;padding:0 8px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);font-size:12.5px;outline:none;min-width:0}
textarea.inp{height:auto;padding:6px 8px}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;color:var(--ink-3);font-weight:500}
.filterbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 12px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:12px;box-shadow:var(--shadow)}
.filterbar .sp{flex:1}

.alert{display:flex;gap:9px;padding:9px 11px;border-radius:var(--r);font-size:12px;line-height:1.55;border:1px solid}
.alert .ic{flex:0 0 auto;margin-top:1px}
.alert .ic svg{width:14px;height:14px}
.alert.trace{background:var(--trace-wash);border-color:var(--trace-line);color:var(--trace-ink)}
.alert.decide{background:var(--decide-wash);border-color:var(--decide-line);color:var(--decide-ink)}
.alert.caution{background:var(--caution-wash);border-color:rgba(226,112,58,.35);color:var(--caution-ink)}
.alert.critical{background:var(--critical-wash);border-color:rgba(208,59,59,.3);color:var(--critical-ink)}
.alert.unknown{background:var(--unknown-wash);border-color:var(--line-2);color:var(--unknown-ink)}
.alert b{font-weight:650}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 12px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);min-width:0}
.stat .l{font-size:11px;color:var(--ink-3)}
.stat .v{font-size:22px;font-weight:650;letter-spacing:-.5px;line-height:1.25}
.stat .v .u{font-size:12px;font-weight:500;color:var(--ink-3);margin-left:2px}
.stat .d{font-size:11px;color:var(--ink-3)}
.stat .d .up{color:var(--good-ink);font-weight:600}
.stat .d .dn{color:var(--critical-ink);font-weight:600}
.stat .sp{margin-top:4px;height:22px}
/* Hero：唯一的大数字，永远是"等你决定的件数" */
.hero{background:linear-gradient(180deg,var(--decide-wash),var(--surface) 80%);border-color:var(--decide-line)}
.hero .v{font-size:42px;line-height:1.05;color:var(--decide-ink)}

.aq{display:flex;flex-direction:column}
.aqrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
.aqrow:last-child{border-bottom:0}
.aqrow:hover{background:var(--surface-2)}
.aqrow .txt{min-width:0;flex:1}
.aqrow .txt .t{font-size:12.5px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aqrow .txt .m{font-size:11px;color:var(--ink-3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aqrow .acts{display:flex;gap:6px;flex:0 0 auto;opacity:.75}
.aqrow:hover .acts{opacity:1}

.stepper{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.step{flex:1;padding:8px 10px 8px 22px;position:relative;min-width:0;border-right:1px solid var(--line);text-align:left}
.step:last-child{border-right:0}
.step:not(:first-child)::before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background:var(--surface);clip-path:polygon(0 0,100% 50%,0 100%);border-right:1px solid var(--line)}
.step .n{font-size:9.5px;color:var(--ink-4);letter-spacing:.5px;font-weight:600}
.step .t{font-size:12px;font-weight:550;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .s{font-size:10.5px;color:var(--ink-3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step.done{background:var(--surface-2)} .step.done:not(:first-child)::before{background:var(--surface-2)}
.step.done .n{color:var(--good-ink)}
.step.cur{background:var(--decide-wash)} .step.cur:not(:first-child)::before{background:var(--decide-wash)}
.step.cur .n,.step.cur .t{color:var(--decide-ink)} .step.cur .t{font-weight:700}

.ev{border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;background:var(--surface-2);font-size:11.5px;line-height:1.55}
.ev+.ev{margin-top:8px}
.ev .h{display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:4px}
.ev .h svg{width:13px;height:13px;flex:0 0 auto}
.aqrow .tag svg,.card .hd .tag svg{width:11px;height:11px}
.btn svg{width:13px;height:13px;flex:0 0 auto}
.ev code,code{font:500 10.5px/1.4 ui-monospace,Menlo,monospace;background:var(--surface-3);padding:1px 4px;border-radius:3px;color:var(--ink-2)}

.cand{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.cand+.cand{margin-top:10px}
.cand .ch{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.cand .ch .t{font-size:13px;font-weight:600}
.cand .ch .r{margin-left:auto;display:flex;gap:6px}
.cand .cb{padding:10px 12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.cand .col .cl{font-size:10px;font-weight:600;letter-spacing:.4px;color:var(--ink-4);margin-bottom:4px;display:flex;align-items:center;gap:4px}
.cand .col ul{margin:0;padding-left:15px;font-size:11.5px;line-height:1.6;color:var(--ink-2)}
.cand .cf{padding:8px 12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-3)}

.meter{height:6px;border-radius:6px;background:var(--surface-3);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter i+i{box-shadow:-2px 0 0 var(--surface)}

.overlay{position:fixed;inset:0;background:rgba(7,16,14,.45);backdrop-filter:blur(3px);z-index:200;display:none;align-items:flex-start;justify-content:center;padding-top:11vh}
.overlay.on{display:flex}
.cmd{width:660px;max-width:92vw;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow-lg);overflow:hidden}
.cmd .top{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--line)}
.cmd input{flex:1;border:0;outline:0;background:none;font-size:15px}
.cmd .list{max-height:52vh;overflow:auto;padding:6px}
.cmd .gl{font-size:10px;font-weight:600;letter-spacing:.6px;color:var(--ink-4);padding:8px 9px 4px}
.cmdrow{display:flex;align-items:center;gap:10px;width:100%;padding:7px 9px;border-radius:var(--r);text-align:left}
.cmdrow.on{background:var(--accent-wash)}
.cmdrow .t{font-size:13px;flex:0 0 auto}
.cmdrow .d{font-size:11px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd .ft{padding:7px 14px;border-top:1px solid var(--line);display:flex;gap:14px;font-size:10.5px;color:var(--ink-4)}
.drawer{position:fixed;right:14px;bottom:38px;width:340px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);z-index:150;display:none;overflow:hidden}
.drawer.on{display:block}

.chartwrap{position:relative}
svg.chart{display:block;width:100%;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:var(--ink-2);padding:0 2px 6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:2.5px;border-radius:2px;display:block}
.tip{position:absolute;pointer-events:none;background:var(--ink-1);color:var(--surface);border-radius:var(--r);padding:6px 8px;
  font-size:11px;line-height:1.5;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .1s;z-index:20;white-space:nowrap}
.tip.on{opacity:1}
.tip .r{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.tip .r i{width:8px;height:8px;border-radius:2px}
.axl{font-size:10px;fill:var(--ink-3);font-variant-numeric:tabular-nums}
.axt{font-size:10px;fill:var(--ink-4)}
.empty{padding:34px 20px;text-align:center;color:var(--ink-3);font-size:12.5px}
.empty b{display:block;color:var(--ink-1);font-size:13.5px;margin-bottom:4px}
.sectitle{font-size:11px;font-weight:650;letter-spacing:.5px;color:var(--ink-3);margin:0 0 8px;display:flex;align-items:center;gap:7px}
.sectitle::after{content:"";flex:1;height:1px;background:var(--line)}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--ink-1);color:var(--surface);
  padding:8px 14px;border-radius:var(--r);font-size:12.5px;box-shadow:var(--shadow-lg);opacity:0;transition:.18s;z-index:300;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>

/* ==================== 图表构件（dataviz 规范） ==================== */
const sv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = (v,d=2)=> (Number(v).toFixed(d).replace(/\.?0+$/,'') || '0');

function niceTicks(lo,hi,count){
  const raw=(hi-lo)/count, mag=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/mag;
  const step=(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*mag;
  const a=Math.floor(lo/step)*step, b=Math.ceil(hi/step)*step;
  const out=[]; for(let v=a;v<=b+step/2;v+=step) out.push(+v.toFixed(10));
  return {ticks:out, lo:a, hi:b, dec:Math.max(0,-Math.floor(Math.log10(step)))};
}
function lineChart(id,cfg){
  const W=cfg.w||760,H=cfg.h||220,m={t:12,r:cfg.mr??52,b:24,l:cfg.ml??40};
  const iw=W-m.l-m.r, ih=H-m.t-m.b;
  const all=cfg.series.flatMap(s=>s.d).concat((cfg.rules||[]).map(r=>r.v));
  const pad=(Math.max(...all)-Math.min(...all))*0.02||1;
  const nt=niceTicks(Math.min(...all)-pad,Math.max(...all)+pad,4);
  const lo=nt.lo,hi=nt.hi,tv=nt.ticks,tdec=nt.dec,n=cfg.series[0].d.length;
  const X=i=>m.l+(iw*i)/(n-1), Y=v=>m.t+ih-((v-lo)/(hi-lo))*ih;
  let g='';
  (cfg.bands||[]).forEach((b,bi)=>{
    if(bi%2===0) g+=`<rect x="${X(b.a)}" y="${m.t}" width="${X(b.b)-X(b.a)}" height="${ih}" fill="${sv('--surface-3')}" opacity=".6"/>`;
    if(bi) g+=`<line x1="${X(b.a)}" x2="${X(b.a)}" y1="${m.t}" y2="${m.t+ih}" stroke="${sv('--axis')}"/>`;
    g+=`<text x="${(X(b.a)+X(b.b))/2}" y="${m.t+11}" text-anchor="middle" class="axt">${b.n}</text>`;
  });
  tv.forEach(v=>{ g+=`<line x1="${m.l}" x2="${m.l+iw}" y1="${Y(v)}" y2="${Y(v)}" stroke="${sv('--grid')}"/>
    <text x="${m.l-7}" y="${Y(v)+3.5}" text-anchor="end" class="axl">${v.toFixed(tdec)}</text>`; });
  (cfg.rules||[]).forEach(r=>{ g+=`<line x1="${m.l}" x2="${m.l+iw}" y1="${Y(r.v)}" y2="${Y(r.v)}" stroke="${sv(r.c||'--critical')}" stroke-width="1.5" stroke-dasharray="5 3" opacity=".85"/>
    <text x="${m.l+iw+5}" y="${Y(r.v)+3.5}" class="axl" fill="${sv(r.c||'--critical')}">${r.n}</text>`; });
  const endY=cfg.series.map(s=>Y(s.d[s.d.length-1]));
  let collide=false;
  for(let a=0;a<endY.length;a++) for(let b=a+1;b<endY.length;b++) if(Math.abs(endY[a]-endY[b])<14) collide=true;
  cfg.series.forEach(s=>{
    const dd=s.d.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
    g+=`<path d="${dd}" fill="none" stroke="${sv(s.c)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${s.dash?' stroke-dasharray="6 4"':''}/>`;
    const li=s.d.length-1;
    g+=`<circle cx="${X(li)}" cy="${Y(s.d[li])}" r="4" fill="${sv(s.c)}" stroke="${sv('--chart-surface')}" stroke-width="2"/>`;
    if(!collide) g+=`<text x="${X(li)+8}" y="${Y(s.d[li])+3.5}" class="axl" style="font-weight:600;fill:${sv('--ink-2')}">${fmt(s.d[li],cfg.dec??1)}</text>`;
  });
  g+=`<line x1="${m.l}" x2="${m.l+iw}" y1="${m.t+ih}" y2="${m.t+ih}" stroke="${sv('--axis')}"/>`;
  (cfg.xt||[]).forEach(t=>{ g+=`<text x="${X(t.i)}" y="${H-7}" text-anchor="middle" class="axl">${t.n}</text>`; });
  g+=`<g id="${id}-cross" style="display:none"><line stroke="${sv('--ink-4')}" stroke-dasharray="3 3" y1="${m.t}" y2="${m.t+ih}"/></g>
      <rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" id="${id}-hit"/>`;
  const legend = cfg.series.length>1
    ? `<div class="legend">${cfg.series.map(s=>`<span><i style="background:${sv(s.c)}"></i>${s.n}</span>`).join('')}${(cfg.rules||[]).map(r=>`<span><i style="height:2px;background-image:repeating-linear-gradient(90deg,${sv(r.c||'--critical')} 0 4px,transparent 4px 7px)"></i>${r.n}</span>`).join('')}</div>` : '';
  return {html:`${legend}<div class="chartwrap" id="${id}-wrap"><svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">${g}</svg><div class="tip" id="${id}-tip"></div></div>`,
    bind(){
      const wrap=document.getElementById(id+'-wrap'); if(!wrap) return;
      const hit=document.getElementById(id+'-hit'),cross=document.getElementById(id+'-cross'),tip=document.getElementById(id+'-tip'),svg=wrap.querySelector('svg');
      hit.addEventListener('mousemove',e=>{
        const r=svg.getBoundingClientRect(), sx=W/r.width;
        let i=Math.round((((e.clientX-r.left)*sx-m.l)/iw)*(n-1)); i=Math.max(0,Math.min(n-1,i));
        cross.style.display=''; cross.querySelector('line').setAttribute('x1',X(i)); cross.querySelector('line').setAttribute('x2',X(i));
        tip.classList.add('on');
        tip.innerHTML=`<b>${(cfg.xlab||(k=>'点 '+(k+1)))(i)}</b>`+cfg.series.map(s=>`<div class="r"><i style="background:${sv(s.c)}"></i>${s.n} <b>${fmt(s.d[i],cfg.dec??2)}</b>${cfg.unit?' '+cfg.unit:''}</div>`).join('');
        tip.style.left=Math.min((X(i)/sx)+12, r.width-tip.offsetWidth-8)+'px';
        tip.style.top=Math.max(4,(e.clientY-r.top)-30)+'px';
      });
      hit.addEventListener('mouseleave',()=>{ cross.style.display='none'; tip.classList.remove('on'); });
    }};
}

function heat(rows,cols,cells){
  const dark=document.documentElement.dataset.theme==='dark';

                 :['#d6f0ec','#a9e0d9','#6ec9bf','#35ac9f','#1c8a7e','#0e6459'];
  const mx=Math.max(...cells.flat());
  return `<div style="display:grid;grid-template-columns:auto repeat(${cols.length},1fr);gap:2px;font-size:11px">
    <div></div>${cols.map(c=>`<div style="text-align:center;font-size:10px;color:var(--ink-3);padding-bottom:2px">${c}</div>`).join('')}

      ${cells[ri].map((v,ci)=>{
        const k=v===0?-1:Math.min(steps.length-1,Math.floor((v/mx)*steps.length));
        const bg=v===0?'var(--unknown-wash)':steps[k], fg=v===0?'var(--unknown-ink)':(dark?(k>=4?'#07231f':'#EEF5F1'):(k>=3?'#fff':'#07231f'));
        const tex=v===0?'background-image:repeating-linear-gradient(135deg,transparent 0 4px,rgba(139,151,163,.28) 4px 5px);':'';
        return `<div title="${rows[ri]} × ${cols[ci]}：${v} 次运行" style="height:26px;display:grid;place-items:center;border-radius:3px;background:${bg};${tex}color:${fg};font-variant-numeric:tabular-nums;font-weight:600">${v||'—'}</div>`;
      }).join('')}`).join('')}
  </div>
  <div class="row" style="margin-top:8px;gap:6px;font-size:10.5px;color:var(--ink-3)">
    <span>运行数</span>${steps.map(s=>`<i style="width:16px;height:9px;border-radius:2px;background:${s};display:inline-block"></i>`).join('')}<span>多</span>
    <span style="margin-left:auto;display:inline-flex;align-items:center;gap:5px"><i style="width:11px;height:11px;border-radius:2px;background:var(--unknown-wash);background-image:repeating-linear-gradient(135deg,transparent 0 4px,rgba(139,151,163,.35) 4px 5px);display:inline-block"></i>无重叠 · 不能分离该因素</span>
  </div>`;
}
function spark(vals,c='--s1'){
  const W=110,H=22,mn=Math.min(...vals),mx=Math.max(...vals),r=(mx-mn)||1;
  const p=vals.map((v,i)=>`${i?'L':'M'}${(i/(vals.length-1)*W).toFixed(1)} ${(H-2-((v-mn)/r)*(H-5)).toFixed(1)}`).join(' ');

function predBand(items){

  [0,.25,.5,.75,1].forEach(f=>{const v=a+(b-a)*f;g+=`<line x1="${X(v)}" x2="${X(v)}" y1="${m.t}" y2="${H-m.b}" stroke="${sv('--grid')}"/><text x="${X(v)}" y="${H-6}" text-anchor="middle" class="axl">${fmt(v,2)}</text>`;});
  items.forEach((it,i)=>{
    const y=m.t+14+i*30,c=sv(it.c||'--s1');
    g+=`<text x="${m.l-9}" y="${y+4}" text-anchor="end" class="axl" style="fill:${sv('--ink-2')}">${it.n}</text>`
     +`<line x1="${X(it.lo)}" x2="${X(it.hi)}" y1="${y}" y2="${y}" stroke="${c}" stroke-width="2" opacity=".28" stroke-linecap="round"/>`
     +`<line x1="${X(it.lo)}" x2="${X(it.lo)}" y1="${y-5}" y2="${y+5}" stroke="${c}" stroke-width="2" opacity=".5"/>`
     +`<line x1="${X(it.hi)}" x2="${X(it.hi)}" y1="${y-5}" y2="${y+5}" stroke="${c}" stroke-width="2" opacity=".5"/>`
     +`<circle cx="${X(it.v)}" cy="${y}" r="4.5" fill="${c}" stroke="${sv('--chart-surface')}" stroke-width="2"><title>${it.n}：预测 ${it.v}，90% 区间 ${it.lo}–${it.hi}</title></circle>`
     +`<text x="${X(it.hi)+8}" y="${y+4}" class="axl" style="fill:${sv('--ink-2')};font-weight:600">${fmt(it.v,3)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="height:${H}px">${g}</svg>`;
}
/* 分层点图：每个水平一行，点=单次运行，用于结果分布 */
function stripPlot(groups,opts={}){
  const W=680,rowH=30,H=groups.length*rowH+34,m={l:132,r:24,t:6},iw=W-m.l-m.r;
  const all=groups.flatMap(g=>g.v);
  const nt=niceTicks(Math.min(...all),Math.max(...all),4);
  const X=v=>m.l+((v-nt.lo)/(nt.hi-nt.lo))*iw;
  let g='';
  nt.ticks.forEach(v=>{g+=`<line x1="${X(v)}" x2="${X(v)}" y1="${m.t}" y2="${H-24}" stroke="${sv('--grid')}"/><text x="${X(v)}" y="${H-8}" text-anchor="middle" class="axl">${v.toFixed(nt.dec)}</text>`;});
  if(opts.rule!=null) g+=`<line x1="${X(opts.rule)}" x2="${X(opts.rule)}" y1="${m.t}" y2="${H-24}" stroke="${sv('--critical')}" stroke-width="1.5" stroke-dasharray="5 3"/>`;
  groups.forEach((grp,i)=>{
    const y=m.t+15+i*rowH;
    g+=`<text x="${m.l-9}" y="${y+4}" text-anchor="end" class="axl" style="fill:${sv('--ink-2')}">${grp.n}</text>`;
    g+=`<text x="${m.l-9}" y="${y+15}" text-anchor="end" class="axt">n=${grp.v.length}</text>`;
    const mean=grp.v.reduce((a,b)=>a+b,0)/grp.v.length;
    g+=`<line x1="${X(mean)}" x2="${X(mean)}" y1="${y-8}" y2="${y+8}" stroke="${sv(grp.c||'--s1')}" stroke-width="2"/>`;
    grp.v.forEach(v=>{ g+=`<circle cx="${X(v)}" cy="${y}" r="4" fill="${sv(grp.c||'--s1')}" fill-opacity=".55" stroke="${sv('--chart-surface')}" stroke-width="1.5"><title>${grp.n}：${v}</title></circle>`; });
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="height:${H}px">${g}</svg>`;
}

/* ---- 命令面板 ---- */
const ACTIONS=[
  {t:'发起运行对比',d:'用对比暂存区里的运行开始',k:'对比 compare',run:()=>go('/diagnose/compare')},
  {t:'批准待决实验',d:'2 个实验等你批准 · 需要你决定',k:'批准 实验 决定',run:()=>go('/research/experiments')},
  {t:'请求实验建议',d:'在已声明边界内求下一个实验点 · 需你批准后执行',k:'建议 优化',run:()=>go('/research/projects/P-0142')},
  {t:'冻结分析数据集',d:'固定输入并生成内容哈希，使分析可复现',k:'冻结 数据集',run:()=>toast('已冻结数据集 DS-2291')},
  {t:'导出证据包',d:'含来源、版本、哈希与限制说明',k:'导出 证据',run:()=>toast('已导出证据包')},
  {t:'查看已验证工艺窗口',d:'系统的最终产出',k:'窗口 结论',run:()=>go('/research/windows')},
  {t:'切换浅色 / 深色主题',d:'办公室分析用浅色，车间与大屏用品牌深色',k:'主题 dark',run:()=>toggleTheme()},
];
const OBJECTS=[
  {t:'OR-24083-0102',d:'运行 · MP-03 · 面型 PV 0.243λ 超差',k:'运行',run:()=>go('/runs/OR-24083-0102')},
  {t:'P-0142',d:'课题 · 面型 PV 收敛 · 阶段 4/7 · 有待批准实验',k:'课题 项目',run:()=>go('/research/projects/P-0142')},
  {t:'E-0142-11',d:'实验 · 待你批准 · 3 水平 × 5 重复',k:'实验',run:()=>go('/research/experiments')},
  {t:'SP-L28A v7',d:'场景包 · 24 变量 · 8 个上下文字段',k:'场景包',run:()=>go('/configure/scenarios')},
  {t:'C-118',d:'组件资产 · 下模芯 · 08-03 装机',k:'模芯 组件',run:()=>go('/configure/components')},
];
let cmdSel=0, cmdRows=[];
function openCmd(){ document.getElementById('overlay').classList.add('on'); const i=document.getElementById('cmdInput'); i.value=''; buildCmd(''); setTimeout(()=>i.focus(),0); }
function closeCmd(){ document.getElementById('overlay').classList.remove('on'); }
function buildCmd(q){
  q=q.trim().toLowerCase();
  const navs=[...NAV,SYSTEM].flatMap(s=>s.groups.flatMap(g=>g.items.map(i=>({t:i.n,d:`${s.name}${g.g?' · '+g.g:''} — ${(PAGE[i.p]||['',''])[1]}`,k:i.p,run:()=>go(i.p)}))));
  const m=a=>a.filter(x=>!q||(x.t+' '+x.d+' '+(x.k||'')).toLowerCase().includes(q));
  const groups=[['动作',m(ACTIONS)],['对象与运行',m(OBJECTS)],['页面',m(navs)]].filter(g=>g[1].length);
  cmdRows=groups.flatMap(g=>g[1]); cmdSel=0;
  document.getElementById('cmdList').innerHTML = groups.length
    ? groups.map(g=>`<div class="gl">${g[0]}</div>`+g[1].map(r=>{const i=cmdRows.indexOf(r);
        return `<button class="cmdrow ${i===0?'on':''}" data-i="${i}" onmousemove="selCmd(${i})" onclick="runCmd(${i})">
          <span class="t">${r.t}</span><span class="d">${r.d}</span></button>`;}).join('')).join('')
    : `<div class="empty" style="padding:26px"><b>没有匹配项</b>试试「对比」「实验」「窗口」「场景包」</div>`;
}
function selCmd(i){ cmdSel=i; document.querySelectorAll('.cmdrow').forEach(el=>el.classList.toggle('on',+el.dataset.i===i)); }
function runCmd(i){ const r=cmdRows[i]; if(!r) return; closeCmd(); r.run(); }
/* ---- 键盘 ---- */
document.getElementById('cmdInput').addEventListener('input',e=>buildCmd(e.target.value));
document.addEventListener('keydown',e=>{
  const open=document.getElementById('overlay').classList.contains('on');
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); open?closeCmd():openCmd(); return; }
  if(!open){
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='b'){ e.preventDefault(); toggleSub(); }
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='i'){ e.preventDefault(); inspOpen?closeInsp():openEvidence(); }
    return;
  }
  if(e.key==='Escape') closeCmd();
  if(e.key==='ArrowDown'){ e.preventDefault(); selCmd(Math.min(cmdRows.length-1,cmdSel+1)); document.querySelector('.cmdrow.on')?.scrollIntoView({block:'nearest'}); }
  if(e.key==='ArrowUp'){ e.preventDefault(); selCmd(Math.max(0,cmdSel-1)); document.querySelector('.cmdrow.on')?.scrollIntoView({block:'nearest'}); }
  if(e.key==='Enter') runCmd(cmdSel);
});
render();
</script>
